name: Move Issues to Testing

on:
  push:
    branches: [dev]

jobs:
  move-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Move Issues to Testing
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const commits = context.payload.commits;
            const issueNumbers = new Set();

            // Парсим коммиты на наличие ключевых слов
            commits.forEach(commit => {
              const message = commit.message;
              const matches = message.match(/(fixes?|closes?|resolves?)\s+#(\d+)/gi);
              if (matches) {
                matches.forEach(match => {
                  const issueNumber = match.match(/#(\d+)/)[1];
                  issueNumbers.add(issueNumber);
                });
              }
            });

            // Получаем детали проекта номер 1 и колонки "Testing"
            const projectQuery = `
              query {
                organization(login: "${context.repo.owner}") {
                  projectV2(number: 1) {
                    id
                    title
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const projectData = await github.graphql(projectQuery);

            if (!projectData.organization.projectV2) {
              console.log("Project not found or no access to project #1");
              console.log("Project data:", JSON.stringify(projectData, null, 2));
              return;
            }

            const projectId = projectData.organization.projectV2.id;
            console.log(`Found project: ${projectData.organization.projectV2.title} (ID: ${projectId})`);

            // Находим колонку "Testing"
            let testingFieldId = null;
            let testingOptionId = null;

            for (const field of projectData.organization.projectV2.fields.nodes) {
              if (field.name === "Status" || field.name === "State") {
                testingFieldId = field.id;
                const testingOption = field.options.find(option => 
                  option.name.toLowerCase().includes("testing") || 
                  option.name.toLowerCase().includes("test")
                );
                if (testingOption) {
                  testingOptionId = testingOption.id;
                  break;
                }
              }
            }

            if (!testingFieldId || !testingOptionId) {
              console.log("Testing column not found in project");
              return;
            }

            // Добавляем label "testing" к каждому issue
            for (const issueNumber of issueNumbers) {
              try {
                // Добавляем label "testing"
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: ['testing']
                });
                
                console.log(`Added "testing" label to issue #${issueNumber}`);
              } catch (error) {
                console.log(`Failed to add label to issue #${issueNumber}: ${error.message}`);
              }
            }
